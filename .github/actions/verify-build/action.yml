name: Verify and build
description: Verify the project and build it.
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "25"
    - name: Clean install dependencies
      run: pnpm install
      shell: bash
    - name: Audit signatures
      run: pnpm audit signatures
      shell: bash
    - name: Generate ANTLR files
      run: pnpm run antlr
      shell: bash
    - name: Verify
      run: pnpm run verify
      shell: bash
    - name: Build
      run: pnpm run build
      shell: bash
